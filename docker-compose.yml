version: '3.9'

services:
  backend:
    build: ./backend
    container_name: nexuscare_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=${JWT_SECRET:-nexuscare_prod_secret_2026}
      - PORT=4000
    volumes:
      - backend_data:/app/prisma

  frontend:
    build: ./frontend
    container_name: nexuscare_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://${HOST_IP:-localhost}:4000
      - NEXT_PUBLIC_SOCKET_URL=http://${HOST_IP:-localhost}:4000
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: nexuscare_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  backend_data:
